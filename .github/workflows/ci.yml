name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Run Gitleaks Secret Detection
        run: |
          gitleaks detect --log-opts="--all" --verbose

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/

      - name: Run Bandit Security Scan
        run: |
          bandit -r src/

      - name: Run Pip-Audit Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements.txt

      - name: Run Pytest Test Suite with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing
